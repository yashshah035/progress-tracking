<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI/ML Roadmap Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper:#EFEBE1;
  --paper-raised:#F5F2E9;
  --line:#D6CFBB;
  --ink:#25261F;
  --ink-soft:#6B6C5E;
  --accent:#3F6B57;
  --accent-soft:#DCE6DD;
  --amber:#B5732A;
  --amber-soft:#EEDFC7;
  --radius:3px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.mono{font-family:'JetBrains Mono',monospace;}

/* ---------- Header ---------- */
.masthead{
  padding:28px 24px 20px;
  border-bottom:1px solid var(--line);
}
.masthead-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
  max-width:1080px;
  margin:0 auto;
}
.masthead h1{
  font-family:'Source Serif 4',Georgia,serif;
  font-weight:600;
  font-size:28px;
  margin:0 0 4px;
  letter-spacing:-0.01em;
}
.masthead p{
  margin:0;
  color:var(--ink-soft);
  font-size:14px;
  max-width:46ch;
}
.progress-block{
  min-width:220px;
  text-align:right;
}
.progress-number{
  font-family:'JetBrains Mono',monospace;
  font-size:30px;
  font-weight:700;
  color:var(--accent);
  line-height:1;
}
.progress-label{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:4px;
}
.progress-bar-track{
  width:220px;
  height:6px;
  background:var(--line);
  border-radius:99px;
  margin-top:10px;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  background:var(--accent);
  border-radius:99px;
  transition:width .4s ease;
}

/* ---------- Layout ---------- */
.app{
  max-width:1080px;
  margin:0 auto;
  display:grid;
  grid-template-columns:220px 1fr;
  gap:0;
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;}
}

/* ---------- Phase nav ---------- */
.phase-nav{
  border-right:1px solid var(--line);
  padding:20px 12px;
}
@media (max-width:760px){
  .phase-nav{
    border-right:none;
    border-bottom:1px solid var(--line);
    display:flex;
    overflow-x:auto;
    padding:14px 16px;
    gap:8px;
  }
}
.phase-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  width:100%;
  text-align:left;
  padding:10px 12px;
  margin-bottom:4px;
  border:none;
  background:transparent;
  border-radius:var(--radius);
  cursor:pointer;
  font-size:13.5px;
  color:var(--ink-soft);
  font-family:'Inter',sans-serif;
}
@media (max-width:760px){
  .phase-btn{width:auto;white-space:nowrap;margin-bottom:0;}
}
.phase-btn:hover{background:var(--paper-raised);}
.phase-btn.active{
  background:var(--accent-soft);
  color:var(--ink);
  font-weight:600;
}
.phase-btn .tick{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  flex-shrink:0;
}
.phase-btn.done .tick{color:var(--accent);}
.phase-btn.done::before{
  content:"✓";
  color:var(--accent);
  font-size:11px;
  margin-right:2px;
}

/* ---------- Main ---------- */
.main{padding:24px 28px 60px;}
@media (max-width:760px){.main{padding:20px 16px 60px;}}

.phase-header{
  margin-bottom:22px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.phase-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--accent);
  margin-bottom:6px;
}
.phase-header h2{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:22px;
  font-weight:600;
  margin:0 0 8px;
}
.phase-header .goal{
  color:var(--ink-soft);
  font-size:14px;
  max-width:64ch;
}

.week-block{
  margin-bottom:26px;
}
.week-title{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:10px;
}
.week-title .wk{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
  background:var(--paper-raised);
  border:1px solid var(--line);
  padding:2px 7px;
  border-radius:99px;
}
.week-title .topic{
  font-weight:600;
  font-size:15.5px;
}

.task{
  display:grid;
  grid-template-columns:22px 1fr;
  gap:10px;
  padding:10px 8px;
  border-radius:var(--radius);
  align-items:start;
}
.task:hover{background:var(--paper-raised);}
.task input[type="checkbox"]{
  appearance:none;
  width:18px;
  height:18px;
  border:1.5px solid var(--ink-soft);
  border-radius:4px;
  margin-top:2px;
  cursor:pointer;
  position:relative;
  background:var(--paper-raised);
  flex-shrink:0;
}
.task input[type="checkbox"]:checked{
  background:var(--accent);
  border-color:var(--accent);
}
.task input[type="checkbox"]:checked::after{
  content:"";
  position:absolute;
  left:5px;
  top:1px;
  width:5px;
  height:9px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
}
.task-body .task-title{
  font-weight:500;
  font-size:14.5px;
  margin-bottom:2px;
}
.task.checked .task-title{
  color:var(--ink-soft);
  text-decoration:line-through;
  text-decoration-color:var(--line);
}
.task-body .task-desc{
  font-size:13.5px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.task-body .task-source{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--accent);
  text-decoration:none;
  background:var(--accent-soft);
  padding:2px 8px;
  border-radius:99px;
}
.task-body .task-source:hover{background:var(--amber-soft);color:var(--amber);}

.artifact-note{
  margin-top:8px;
  padding:12px 14px;
  background:var(--amber-soft);
  border-left:3px solid var(--amber);
  border-radius:var(--radius);
  font-size:13.5px;
  color:#5C4319;
}
.artifact-note b{color:var(--amber);}

.footer-bar{
  max-width:1080px;
  margin:0 auto;
  padding:14px 28px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--ink-soft);
  font-size:12.5px;
}
.reset-link{
  background:none;
  border:none;
  color:var(--ink-soft);
  text-decoration:underline;
  cursor:pointer;
  font-size:12.5px;
  font-family:'Inter',sans-serif;
}
.reset-link:hover{color:var(--amber);}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-top">
    <div>
      <h1>AI/ML Roadmap Log</h1>
      <p>Life-Sciences GenAI/LLM Engineer track — six phases, built for ~1–1.5 hrs on weekdays and longer weekend blocks.</p>
    </div>
    <div class="progress-block">
      <div class="progress-number"><span id="doneCount">0</span><span class="mono" style="color:var(--ink-soft);font-size:16px;">/<span id="totalCount">0</span></span></div>
      <div class="progress-label">tasks logged</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="app">
  <nav class="phase-nav" id="phaseNav"></nav>
  <main class="main" id="mainPanel"></main>
</div>

<div class="footer-bar">
  <span>Progress is saved automatically to this artifact.</span>
  <button class="reset-link" id="resetBtn">Clear all progress</button>
</div>

<script>

const STORAGE_KEY = "roadmap-progress-v1";
let checkedState = {};
let activePhase = DATA[0].id;

function allTaskIds(){
  const ids = [];
  DATA.forEach(phase => phase.weekGroups.forEach(wg => wg.tasks.forEach((task, i) => {
    ids.push(phase.id + "__" + wg.wk + "__" + i);
  })));
  return ids;
}

function phaseTaskIds(phase){
  const ids = [];
  phase.weekGroups.forEach(wg => wg.tasks.forEach((task, i) => {
    ids.push(phase.id + "__" + wg.wk + "__" + i);
  }));
  return ids;
}

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      checkedState = JSON.parse(res.value);
    }
  }catch(e){
    checkedState = {};
  }
}

let saveTimer = null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(checkedState), false);
    }catch(e){ /* best effort */ }
  }, 250);
}

function renderNav(){
  const nav = document.getElementById("phaseNav");
  nav.innerHTML = "";
  DATA.forEach((phase, idx) => {
    const ids = phaseTaskIds(phase);
    const done = ids.filter(id => checkedState[id]).length;
    const total = ids.length;
    const btn = document.createElement("button");
    btn.className = "phase-btn" + (phase.id === activePhase ? " active" : "") + (done === total ? " done" : "");
    btn.innerHTML = `<span>${idx}. ${phase.title}</span><span class="tick">${done}/${total}</span>`;
    btn.addEventListener("click", () => { activePhase = phase.id; render(); });
    nav.appendChild(btn);
  });
}

function renderMain(){
  const main = document.getElementById("mainPanel");
  const phase = DATA.find(p => p.id === activePhase);
  main.innerHTML = "";

  const header = document.createElement("div");
  header.className = "phase-header";
  header.innerHTML = `
    <div class="phase-eyebrow mono">${phase.weeks}</div>
    <h2>${phase.title}</h2>
    <div class="goal">${phase.goal}</div>
  `;
  main.appendChild(header);

  phase.weekGroups.forEach(wg => {
    const block = document.createElement("div");
    block.className = "week-block";

    const titleRow = document.createElement("div");
    titleRow.className = "week-title";
    titleRow.innerHTML = `<span class="wk">${wg.wk}</span><span class="topic">${wg.topic}</span>`;
    block.appendChild(titleRow);

    wg.tasks.forEach((task, i) => {
      const id = phase.id + "__" + wg.wk + "__" + i;
      const isChecked = !!checkedState[id];

      const row = document.createElement("label");
      row.className = "task" + (isChecked ? " checked" : "");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = isChecked;
      cb.addEventListener("change", () => {
        if(cb.checked){ checkedState[id] = true; } else { delete checkedState[id]; }
        saveProgress();
        render();
      });

      const body = document.createElement("div");
      body.className = "task-body";
      const srcLink = task.url
        ? `<a class="task-source" href="${task.url}" target="_blank" rel="noopener">${task.src}</a>`
        : `<span class="task-source" style="cursor:default;">${task.src}</span>`;
      body.innerHTML = `
        <div class="task-title">${task.t}</div>
        <div class="task-desc">${task.d}</div>
        ${srcLink}
      `;

      row.appendChild(cb);
      row.appendChild(body);
      block.appendChild(row);
    });

    if(wg.artifact){
      const note = document.createElement("div");
      note.className = "artifact-note";
      note.innerHTML = `<b>Artifact:</b> ${wg.artifact}`;
      block.appendChild(note);
    }

    main.appendChild(block);
  });
}

function renderProgress(){
  const ids = allTaskIds();
  const done = ids.filter(id => checkedState[id]).length;
  const total = ids.length;
  document.getElementById("doneCount").textContent = done;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("progressFill").style.width = total ? ((done/total)*100) + "%" : "0%";
}

function render(){
  renderNav();
  renderMain();
  renderProgress();
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if(confirm("Clear all logged progress? This can't be undone.")){
    checkedState = {};
    saveProgress();
    render();
  }
});

(async function init(){
  await loadProgress();
  render();
})();
</script>
</body>
</html>
